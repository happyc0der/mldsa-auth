# Every gate this project defines, on every push, on two platforms.
#
# Until V3 these gates existed only as commands one agent ran by hand on one
# macOS machine. Running the same suite on Linux found five defects macOS
# could not (libm linking, LeakSanitizer leaks, gcc -Wformat-truncation, and
# two vacuous-pass holes in the currency gate itself), which is why the second
# platform is not optional here.
#
# Standing rule 3 is enforced by construction: check_build_current.sh runs in
# the SAME step as ctest, so a stale tree cannot produce a green tick.
name: CI

on:
  push:
    branches: [main, ci-bringup]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: ${{ matrix.os }}·${{ matrix.cc }}·${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: clang, config: debug }
          - { os: ubuntu-latest, cc: clang, config: asan }
          - { os: ubuntu-latest, cc: clang, config: ubsan }
          # gcc earns its own job: it diagnosed 17 defects clang does not
          # implement a warning for (V3-1). A clang-only CI would ship them.
          - { os: ubuntu-latest, cc: gcc, config: debug }
          - { os: macos-latest, cc: clang, config: debug }
          - { os: macos-latest, cc: clang, config: asan }
          - { os: macos-latest, cc: clang, config: ubsan }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Record the runner (the label's meaning changes over time)
        run: |
          uname -srm
          "${{ matrix.cc }}" --version | head -1
          cmake --version | head -1
          # Evidence for the liboqs target chosen below: on arm64, print the
          # crypto features -mcpu=native actually enables on THIS runner.
          case "$(uname -m)" in
            arm64|aarch64)
              echo "-mcpu=native ARM crypto features:"
              printf '' | "${{ matrix.cc }}" -mcpu=native -dM -E -x c - 2>/dev/null \
                | grep -E '__ARM_FEATURE_(CRYPTO|SHA2|AES)' \
                || echo "  (none -- -mcpu=native does not enable the crypto extensions here)" ;;
          esac

      - name: Name the build directory
        run: echo "BUILD_DIR=build-${{ matrix.cc }}-${{ matrix.config }}" >> "$GITHUB_ENV"

      # NO dependency cache, deliberately. The plan assumed ~8 min per job to
      # build liboqs + libsodium and called caching mandatory; measured on this
      # workflow it is 35 s cold against 11 s warm -- a ~24 s saving. Against
      # that: MLDSA_OQS_OPT_TARGET defaults to auto (-march=native), and
      # GitHub's Linux fleet is heterogeneous (EPYC 9V74, EPYC 7763, Xeon
      # 8370C). Bring-up run 2 restored run 1's EPYC-built tree onto a
      # different CPU and 13 of 15 tests died with SIGILL. Keying the cache on
      # the CPU model would fix that at the cost of most of the hit rate, for a
      # saving that is already small -- so every job builds its dependencies
      # from the pinned sources on the machine that will run them.

      - name: Configure
        run: |
          case "${{ matrix.config }}" in
            asan)  extra=-DENABLE_ASAN=ON ;;
            ubsan) extra=-DENABLE_UBSAN=ON ;;
            *)     extra= ;;
          esac
          # liboqs's sha2_armv8.c needs the ARMv8 crypto extensions. On this
          # arm64 macOS runner the project default (MLDSA_OQS_OPT_TARGET=auto
          # -> -mcpu=native) does not provide them and that file fails to
          # compile -- 'always_inline function vsha256hq_u32 requires target
          # feature sha2'. The same default builds cleanly on a physical M4
          # Pro, so this is a property of the runner, not of the setting; the
          # step above records what native resolves to here. `generic` is the
          # project's own documented portable target (-march=armv8-a+crypto on
          # arm64) and still selects the AARCH64 backends, so the macOS jobs
          # pin it rather than silently losing the platform.
          opt=
          if [ "${{ runner.os }}" = "macOS" ]; then
            opt=-DMLDSA_OQS_OPT_TARGET=generic
          fi
          cmake -S . -B "$BUILD_DIR" -DCMAKE_C_COMPILER=${{ matrix.cc }} $extra $opt

      - name: Build
        run: cmake --build "$BUILD_DIR" -j

      - name: Standing rule 2 — prove the instrumentation is linked
        if: matrix.config == 'asan' || matrix.config == 'ubsan'
        run: tools/check_sanitizer_link.sh "$BUILD_DIR" "${{ matrix.config }}"

      # Standing rule 3: currency and the suite in ONE invocation, so a stale
      # tree cannot produce a number at all.
      - name: Standing rule 3 + suite
        run: tools/check_build_current.sh "$BUILD_DIR" && ctest --test-dir "$BUILD_DIR" --output-on-failure

      - name: Environment block (records the CPU these results came from)
        run: ./"$BUILD_DIR"/bench/bench_primitives --smoke | sed -n '/^mldsa-auth bench/,/^  mode /p'

  # The two gates that check the SPECIFICATION against the tree. Neither needs
  # a build, so both cost seconds -- and both belong on a push rather than in
  # the nightly, because a document that is wrong about what the software does
  # is wrong for everyone who reads it in the meantime.
  #
  # check_spec_constants.sh also runs in the nightly. The duplication is
  # deliberate: the nightly proves it on a schedule, this proves it before the
  # wrong claim reaches main.
  spec:
    name: specification vs the tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Every derived size appears in the specification
        run: tools/audit/check_spec_constants.sh "$PWD"

      - name: Error codes, log events and log fields match the daemon both ways
        run: python3 tools/audit/check_spec_vocabularies.py "$PWD"

  fuzz-and-scan:
    name: fuzz smoke + secret scan (Linux only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Apple clang ships no libFuzzer runtime, so this gate is Linux-only by
      # necessity, not by preference (see README).
      - name: Configure and build the fuzz tree
        run: |
          cmake -S . -B build-fuzz -DCMAKE_C_COMPILER=clang -DMLDSA_FUZZ=ON
          cmake --build build-fuzz -j

      - name: Standing rule 3 + fuzz-labelled tests
        run: tools/check_build_current.sh build-fuzz && ctest --test-dir build-fuzz -L fuzz --output-on-failure

      - name: Fuzz smoke (60 s per target) — any crash or artifact fails
        run: |
          tests/fuzz/run_fuzz.sh smoke build-fuzz | tee smoke.log
          if grep -qE "crashes=[1-9]|artifacts=[1-9]" smoke.log; then
            echo "::error::fuzzing produced a crash or artifact"; exit 1
          fi

      - name: Repository secret scan
        run: |
          ./build-fuzz/tests/fuzz/fuzz_keys_replay --scan-secret-dirs \
            tests/fuzz/regressions tests/fuzz/dict | tee scan.log
          grep -q " 0 violation" scan.log || { echo "::error::secret scan found violations"; exit 1; }

  release:
    name: Release + install + hardening (Linux, ${{ matrix.cc }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # The configuration a deployment actually uses, which until V4-11 was
      # never built in CI: Release, with a NAMED CPU target rather than the
      # `auto` default that tunes for the building machine. ubuntu-latest is
      # x86_64, so this is also the only place the documented `x86-64-v3`
      # recipe is exercised -- the developer machine is arm64.
      - name: Configure and build Release
        run: |
          cmake -S . -B build-release -DCMAKE_C_COMPILER=${{ matrix.cc }} \
                -DCMAKE_BUILD_TYPE=Release -DMLDSA_OQS_OPT_TARGET=x86-64-v3
          cmake --build build-release -j

      - name: Standing rule 3 + suite
        run: tools/check_build_current.sh build-release && ctest --test-dir build-release --output-on-failure

      # --component is load-bearing, not tidiness: liboqs is vendored with
      # FetchContent and defines its own install() rules, so a bare install
      # also writes a pin-locked, -march-tuned liboqs.a and its headers into
      # the prefix (finding F73).
      - name: Install
        run: cmake --install build-release --prefix "$PWD/stage" --component mldsa-authd

      - name: The install tree is exactly what ships
        run: |
          find stage -type f | sort | tee installed.txt
          test "$(wc -l < installed.txt)" -eq 6 || {
            echo "::error::the install tree is not the six files that ship"; exit 1; }

      # THE gate this job exists for. It is meaningful here and much weaker on
      # macOS, where RELRO and BIND_NOW are reported n/a because they are ELF
      # concepts -- so it is required on Linux and nowhere else.
      - name: Hardening, REQUIRED, on the install tree
        run: tools/audit/check_hardening.sh "$PWD/stage" --require

      - name: One optimized backend, no portable-C
        run: tools/check_backend_symbols.sh build-release

  # V4-13b: the browser client. The client core compiled to WebAssembly must
  # reproduce the native KAT golden byte-for-byte, the module must export
  # exactly web/exports.txt within its size budget, and the module plus the JS
  # transport must log in to the real daemon from Node.
  #
  # Both toolchains are PINNED the way this project pins its libraries, and
  # neither comes through a third-party action (V4-13b decision):
  #   * emsdk cloned at the commit its 6.0.9 tag names, checked after checkout,
  #     then SDK 6.0.9 installed by emsdk itself. CMakeLists.txt refuses any
  #     other Emscripten, so a drift fails at configure, not in the golden.
  #   * Node from nodejs.org by version, verified by SHA-256 before it runs.
  # Linux only: the claim under test is "wasm equals native", and the native
  # side is already checked on both platforms by the suite jobs.
  wasm:
    name: wasm client (Emscripten 6.0.9, Node 24.21.0, Chrome for Testing 154)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EMSDK_COMMIT: 5eb0bde7585670252e8ba05e9d361627bffd08b5   # emsdk tag 6.0.9
      EMSCRIPTEN_VERSION: "6.0.9"
      NODE_VERSION: v24.21.0
      NODE_SHA256: fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6  # node-v24.21.0-linux-x64.tar.xz
      CHROME_VERSION: 154.0.8037.57
      CHROME_SHA256: ceee2972074d441ea7c4ba8bcc0eaab77e7e87680f6653d73d3065851fe10302  # chrome-linux64.zip (MD5 matches the bucket)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Node, pinned by version and SHA-256
        run: |
          curl -fsSLo "$RUNNER_TEMP/node.tar.xz" \
            "https://nodejs.org/dist/$NODE_VERSION/node-$NODE_VERSION-linux-x64.tar.xz"
          echo "$NODE_SHA256  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          "$RUNNER_TEMP/node/bin/node" --version

      - name: Emscripten, pinned (emsdk at a fixed commit, SDK 6.0.9)
        run: |
          git clone --quiet https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout --quiet --detach "$EMSDK_COMMIT"
          test "$(git -C "$RUNNER_TEMP/emsdk" rev-parse HEAD)" = "$EMSDK_COMMIT"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSCRIPTEN_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"

      # CTest runs the wasm tests with the PINNED node, named explicitly --
      # left alone it would use whichever node Emscripten's config names.
      - name: The wasm tree -- standing rule 3 + its suite (KATs, module gates)
        run: |
          . "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcc --version | head -1
          emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CROSSCOMPILING_EMULATOR="$RUNNER_TEMP/node/bin/node"
          cmake --build build-wasm -j4
          tools/check_build_current.sh build-wasm && ctest --test-dir build-wasm --output-on-failure

      # Chrome for Testing, pinned like Node (V4-13c): by version from Google's
      # own bucket, verified by SHA-256 before it runs. The runner's
      # preinstalled Chrome is not used -- it moves under us.
      # Ubuntu 24.04 forbids unprivileged user namespaces through AppArmor,
      # which is what Chrome's sandbox needs. The runner VM is lifted from that
      # rule rather than the browser run with --no-sandbox: the test's pages
      # are exactly what a sandbox is for.
      - name: Chrome for Testing, pinned by version and SHA-256
        run: |
          curl -fsSLo "$RUNNER_TEMP/chrome.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-linux64.zip"
          echo "$CHROME_SHA256  $RUNNER_TEMP/chrome.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$RUNNER_TEMP"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          "$RUNNER_TEMP/chrome-linux64/chrome" --version

      # A separate step, so the native tree is configured without emsdk's
      # environment (its CC, its node) in the way. browser_e2e exists only
      # when a browser is named, so its presence is asserted: a gate that can
      # pass by not having the test is not a gate.
      - name: The native daemon fixture, the wasm client logging in to it, and the browser
        run: |
          cmake -S . -B build-native -DMLDSA_WASM_DIR="$PWD/build-wasm" \
            -DMLDSA_NODE="$RUNNER_TEMP/node/bin/node" \
            -DMLDSA_BROWSER="$RUNNER_TEMP/chrome-linux64/chrome"
          cmake --build build-native -j4
          ctest --test-dir build-native -N -R '^browser_e2e$' | grep -q 'Total Tests: 1' || \
            { echo "::error::browser_e2e is not registered"; exit 1; }
          tools/check_build_current.sh build-native && \
            ctest --test-dir build-native --output-on-failure \
              -R '^(wasm_interop|web_no_crypto|test_client_wasm|test_passphrase|web_flows|browser_e2e)$'

  deploy:
    name: unit + offline build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # CI runs the SAME TWO SCRIPTS a developer runs, rather than a second
      # implementation of them in YAML. Both need Docker -- systemd's own
      # analysers are not on a macOS host, and an offline build has to happen
      # somewhere its network can actually be taken away -- and Docker is
      # preinstalled on this runner.
      #
      # Both scripts SKIP rather than fail when Docker is missing, which is
      # right for a developer and wrong for a gate, so each run is required
      # not to have skipped. A gate that can pass by not running is not a gate.
      - name: The unit, per systemd's own analysers
        run: |
          sh tests/deploy_checks.sh 2>&1 | tee unit.log
          grep -q "^SKIP:" unit.log && { echo "::error::the unit gate skipped"; exit 1; }
          grep -q "^PASS: DEPLOY: all checks" unit.log || {
            echo "::error::the unit gate did not report all checks passing"; exit 1; }

      - name: Populate the dependency cache
        run: sh deploy/fetch-deps.sh "$RUNNER_TEMP/deps"

      # The happy path AND three controls: a cache git cannot read, one
      # changed byte, and a clone moved off the pinned commit. The controls
      # are the point -- an offline cache is the one place a mistake would
      # silently WEAKEN a pin.
      - name: Build with the network switched off, and prove the cache is checked
        run: |
          sh tests/offline_build.sh "$RUNNER_TEMP/deps" 2>&1 | tee offline.log
          grep -q "^SKIP:" offline.log && { echo "::error::the offline gate skipped"; exit 1; }
          grep -q "^PASS: OFFLINE: all checks" offline.log || {
            echo "::error::the offline gate did not report all checks passing"; exit 1; }
