# The two gates that do not fit a push: the committed mutation suite (one campaign
# per step, tools/mutations/) and the 600 s fuzz budgets. Both had only ever
# run by hand on one laptop before V3-4; the campaigns themselves were not
# even in the repository until this workflow needed them.
#
# GitHub disables a scheduled workflow after 60 days without a commit. A
# nightly that stops is therefore NOT a nightly that passes -- the README
# says so next to the badge.
name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC: off the hour, per GitHub's load guidance
  workflow_dispatch:
  push:
    branches: [nightly-bringup]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # a nightly should finish, not be superseded

jobs:
  # Every campaign anchor still matches its source EXACTLY once, checked
  # statically in seconds.
  #
  # It gates the campaigns rather than running beside them, and that ordering is
  # the whole point: a rotted anchor makes the runner abort, so discovering one
  # after three hours of mutation runs costs three hours to learn something a
  # five-minute job knew at the start. The tool was committed with V4-9d and
  # then ran nowhere -- the same way check_spec_constants.sh sat unused until
  # V4-9c -- and it earned its place during V4-10a by catching v48b's C4.
  mutation-anchors:
    name: mutation anchors still match
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Every anchor matches exactly once, and every mutation is covered
        run: python3 tools/audit/check_mutation_anchors.py "$PWD"

  mutations:
    name: mutations · ${{ matrix.campaign }}
    runs-on: ubuntu-latest
    needs: mutation-anchors
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # One job per campaign; each is the mutation set of one v2/v3 step.
        # v35 is NOT here and must not be: its mutations anchor inside
        # bench_common.c's #if defined(__APPLE__) branch, so on Linux the
        # anchors cannot match and the runner would abort. It runs in
        # mutations-macos below -- which is the point, since U2 is a defect
        # that only ever appeared on a macOS VM.
        campaign: [v23, v24, v25, v26, v27, v28, v29, v33, v46, v47, v48a, v48b,
                   v49a, v49b, v49c, v49d, v50a, v50b]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Record the runner
        run: |
          uname -srm
          clang --version | head -1
          grep -m1 'model name' /proc/cpuinfo || true

      # The standing rule: campaigns run against a fresh ASan tree (several
      # mutations are wipe/leak class, and LSan runs here). No cache: a
      # -march=native tree cannot be shared across GitHub's mixed fleet (V3-3).
      - name: Fresh ASan tree, instrumentation proven
        run: |
          cmake -S . -B build-asan -DCMAKE_C_COMPILER=clang -DENABLE_ASAN=ON
          cmake --build build-asan -j
          tools/check_sanitizer_link.sh build-asan asan

      # The runner exits nonzero on any SURVIVED verdict, on mutation residue,
      # or on a final fingerprint mismatch -- so the job is red without a wrapper.
      - name: Run the campaign
        run: |
          tools/run_mutations_v2.sh "$PWD" "$RUNNER_TEMP/mut" \
            "tools/mutations/mutate_${{ matrix.campaign }}.py" \
            "tools/mutations/spec_${{ matrix.campaign }}.txt" build-asan 2>&1 | tee campaign.log
          exit "${PIPESTATUS[0]}"

      - name: Upload the campaign logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutations-${{ matrix.campaign }}
          path: |
            campaign.log
            ${{ runner.temp }}/mut/mutation_v2-logs
          retention-days: 30

  # V3-4 kept macOS out of the nightly (the Linux ASan tree is stricter, and
  # macOS runners are the slow, costly ones) and said so as a decision
  # "reversible by adding a matrix row". This is that row, added for a reason:
  # the v35 campaign's mutations live in macOS-only code, so without it U2 --
  # whose whole point is a defect that only appears on a macOS VM -- is
  # re-verified nowhere automatically. Two mutations, ~2 minutes.
  mutations-macos:
    name: mutations · ${{ matrix.campaign }} (macOS-only code)
    runs-on: macos-latest
    needs: mutation-anchors
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        campaign: [v35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Record the runner
        run: |
          uname -srm
          clang --version | head -1
          sysctl -n machdep.cpu.brand_string || true

      # -mcpu=native enables no crypto extensions on this runner, so liboqs's
      # sha2_armv8.c will not compile with the project default (V3-3).
      - name: Fresh ASan tree, instrumentation proven
        run: |
          cmake -S . -B build-asan -DCMAKE_C_COMPILER=clang -DENABLE_ASAN=ON \
            -DMLDSA_OQS_OPT_TARGET=generic
          cmake --build build-asan -j
          tools/check_sanitizer_link.sh build-asan asan

      - name: Run the campaign
        run: |
          tools/run_mutations_v2.sh "$PWD" "$RUNNER_TEMP/mut" \
            "tools/mutations/mutate_${{ matrix.campaign }}.py" \
            "tools/mutations/spec_${{ matrix.campaign }}.txt" build-asan 2>&1 | tee campaign.log
          exit "${PIPESTATUS[0]}"

      - name: Upload the campaign logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutations-${{ matrix.campaign }}-macos
          path: |
            campaign.log
            ${{ runner.temp }}/mut/mutation_v2-logs
          retention-days: 30

  formal:
    name: ProVerif model + controls
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build the ProVerif CLI from source
        run: |
          # opam's proverif package needs GTK (V4-2 S7); the CLI needs only
          # ocaml + ocamlfind. Pinned tarball, checked by SHA-256.
          sudo apt-get update -qq && sudo apt-get install -y -qq ocaml ocaml-findlib
          curl -fsSL https://bblanche.gitlabpages.inria.fr/proverif/proverif2.05.tar.gz -o pv.tgz
          echo "4871f53c32ab4a04669a060c4886ba5d9080496963fb980a9a62d2c429ceabc4  pv.tgz" | sha256sum -c -   # pin the toolchain like every other dependency
          mkdir pv && tar -xzf pv.tgz -C pv --strip-components=1
          ( cd pv && ./build ) || true      # build exits 2 on the GUI half
          test -x pv/proverif
      - name: Prove the model and every control
        run: formal/run.sh "$PWD/pv/proverif"

  # The specification's own arithmetic, re-derived from the headers and diffed
  # against the document. It needs no build and takes under a second -- and it
  # had been WRITTEN SINCE V4-3 AND WIRED NOWHERE: no CI job, no nightly job, no
  # CTest referenced it, so the one gate that independently checks whether the
  # spec's numbers are still true had never run automatically. V4-9c found that
  # while planning, and it matters: 6.3 quotes ROTATE's content as 8612, this
  # derives it from MLDSA_PUBLIC_KEY_BYTES and the rest, and a drift between
  # them is exactly how a buffer ends up sized from a stale number.
  spec-constants:
    name: spec constants re-derived from the tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Re-derive every size and diff it against the specification
        run: tools/audit/check_spec_constants.sh "$PWD"

  fuzz-local:
    name: fuzz 600 s · ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [wire, handshake, session, frame, keys, envelope, authd_config, authd_conn,
                 localapi, authmsg, ws]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Record the runner
        run: |
          uname -srm
          clang --version | head -1
          grep -m1 'model name' /proc/cpuinfo || true

      - name: Fuzz tree
        run: |
          cmake -S . -B build-fuzz -DCMAKE_C_COMPILER=clang -DMLDSA_FUZZ=ON
          cmake --build build-fuzz -j

      - name: Standing rule 3 + fuzz-labelled tests
        run: tools/check_build_current.sh build-fuzz && ctest --test-dir build-fuzz -L fuzz --output-on-failure

      # run_fuzz.sh reports crashes but never exits nonzero on them; the grep
      # is the gate, exactly as in ci.yml's smoke run.
      - name: 600 s run — any crash or artifact fails
        run: |
          tests/fuzz/run_fuzz.sh local build-fuzz ${{ matrix.target }} | tee local.log
          if grep -qE "crashes=[1-9]|artifacts=[1-9]" local.log; then
            echo "::error::fuzz_${{ matrix.target }} produced a crash or artifact -- see the uploaded artifact"; exit 1
          fi

      # Kept even on failure: a crash found on a runner must be replayable
      # here and admissible through tests/fuzz/add_regression.sh.
      - name: Upload artifacts and log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            local.log
            build-fuzz/fuzz-artifacts/${{ matrix.target }}
            build-fuzz/fuzz-logs
          if-no-files-found: ignore
          retention-days: 30
